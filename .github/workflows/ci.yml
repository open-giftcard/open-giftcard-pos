name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails when contracts/README.md declares a hash that is not the file's.
      # The in-repo contract assertions validate the committed document, so a
      # stale document passes them; only this compares the pin to reality.
      - name: Backend contract pin matches its recorded hash
        shell: bash
        run: bash scripts/verify-contract-pin.sh

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GiftCardPos.slnx

      - name: Format
        run: dotnet format GiftCardPos.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build GiftCardPos.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GiftCardPos.slnx --configuration Release --no-build
