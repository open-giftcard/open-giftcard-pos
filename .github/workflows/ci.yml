name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GiftCardPos.slnx

      - name: Format
        run: dotnet format GiftCardPos.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build GiftCardPos.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GiftCardPos.slnx --configuration Release --no-build
